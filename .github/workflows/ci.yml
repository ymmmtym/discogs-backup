name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.6"
          enable-cache: true
      - name: Install dependencies
        run: |
          uv python install 3.12
          uv venv --python 3.12
          uv pip install -r requirements-dev.txt
      - name: Run pytest
        run: .venv/bin/pytest -v

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/gcp
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg STORAGE_BACKEND=gcs -t discogs-backup:ci .
      - name: Check imports in the image
        run: |
          docker run --rm --entrypoint python discogs-backup:ci \
            -c "import discogs_backup, storage, worker; print('ok')"
