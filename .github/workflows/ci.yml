name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Install dependencies
        run: |
          uv python install 3.12
          uv venv --python 3.12
          uv pip install -r requirements-dev.txt
      - name: Run pytest
        run: .venv/bin/pytest -v

  docker:
    name: Docker build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg STORAGE_BACKEND=gcs -t discogs-backup:ci .
      - name: Check imports in the image
        run: |
          docker run --rm --entrypoint python discogs-backup:ci \
            -c "import discogs_backup, storage, worker; print('ok')"
