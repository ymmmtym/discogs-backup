# コンテナイメージのビルド（Cloud Build）
#
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_IMAGE="<region>-docker.pkg.dev/<project>/<repo>/<name>:latest",_STORAGE_BACKEND=gcs .
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - STORAGE_BACKEND=${_STORAGE_BACKEND}
      - -t
      - ${_IMAGE}
      - .

images:
  - ${_IMAGE}

options:
  logging: CLOUD_LOGGING_ONLY
